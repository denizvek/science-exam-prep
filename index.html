<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מתכות, סלעים ומלחים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Assistant:wght@400;600;700;800&display=swap">
</head>
<body>
<style id="css">
/* Layout: an expedition map — a mission dashboard (learning meter + three "worlds"), each world opens into lessons, cards and practice; the final exam unlocks at 75% */
:root{
  --bg:#eef2f9; --bg2:#e3e9f5; --surface:#ffffff; --ink:#131a33; --muted:#5a6483; --line:#d5dcec;
  --primary:#3150f5; --primary-ink:#ffffff; --primary-soft:#e2e7ff;
  --xp:#ffbe1a; --xp-ink:#3a2700;
  --copper:#e2692c; --copper-soft:#fde9de;
  --rock:#8b6a4e; --rock-soft:#f1e7dd;
  --salt:#0aa3a0; --salt-soft:#d9f4f2;
  --good:#17a35a; --good-soft:#ddf5e7; --bad:#e0443b; --bad-soft:#fde3e1;
  --shadow:0 1px 0 rgba(19,26,51,.06),0 8px 24px -12px rgba(19,26,51,.18);
  --display:"Fredoka","Assistant",system-ui,sans-serif;
  --body:"Assistant","Fredoka",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1224; --bg2:#121a33; --surface:#17213d; --ink:#eaf0ff; --muted:#9aa6c8; --line:#26325a;
  --primary:#7f94ff; --primary-ink:#0c1224; --primary-soft:#1f2a55;
  --xp:#ffc93d; --xp-ink:#2b1d00;
  --copper:#ff925a; --copper-soft:#3a2418; --rock:#d0a582; --rock-soft:#33271e; --salt:#3fd6d2; --salt-soft:#123534;
  --good:#45d488; --good-soft:#143524; --bad:#ff7a70; --bad-soft:#3d1c1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1224; --bg2:#121a33; --surface:#17213d; --ink:#eaf0ff; --muted:#9aa6c8; --line:#26325a;
  --primary:#7f94ff; --primary-ink:#0c1224; --primary-soft:#1f2a55;
  --xp:#ffc93d; --xp-ink:#2b1d00;
  --copper:#ff925a; --copper-soft:#3a2418; --rock:#d0a582; --rock-soft:#33271e; --salt:#3fd6d2; --salt-soft:#123534;
  --good:#45d488; --good-soft:#143524; --bad:#ff7a70; --bad-soft:#3d1c1b;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;direction:rtl}
[hidden]{display:none!important}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#root{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,6vw,2.4rem)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.15rem}
.brand .logo{width:38px;height:38px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;background:var(--primary-soft);flex:none}
.av.lg{width:64px;height:64px;font-size:2.2rem}
.back{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:800;font-size:1rem;background:var(--bg2);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.xp{background:var(--xp);color:var(--xp-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.wa{background:#25d366;color:#05301a;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.85rem;font-weight:700;background:var(--bg2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.xp{background:var(--xp);color:var(--xp-ink)}
.pill.primary{background:var(--primary-soft);color:var(--primary)}
.bar{height:10px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--primary));transition:width .5s}

/* hero meter */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--xp) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:2.6rem;line-height:1}
.ring small{display:block;color:var(--muted);font-size:.8rem;font-weight:700;letter-spacing:.02em}
.milestones{display:flex;gap:6px;margin-top:6px}
.milestones span{flex:1;font-size:.78rem;color:var(--muted);text-align:center}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .row{justify-content:center}}

/* worlds */
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.worlds{grid-template-columns:1fr}}
.world{--c:var(--primary);--cs:var(--primary-soft);text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:0;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.world:hover{transform:translateY(-3px)}
.world .art{background:var(--cs);padding:8px 8px 0}
.world .art svg{display:block;width:100%;height:auto;border-radius:14px 14px 0 0}
.world .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.world .tag{color:var(--c);font-weight:800;font-size:.85rem}
.w-metals{--c:var(--copper);--cs:var(--copper-soft)}
.w-rocks{--c:var(--rock);--cs:var(--rock-soft)}
.w-salts{--c:var(--salt);--cs:var(--salt-soft)}

/* exam card */
.exam{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border-radius:22px;padding:20px;background:var(--ink);color:var(--bg)}
.exam .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.exam h2{color:var(--bg)}
.exam .lock{font-size:2.4rem}
.exam .pill{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
.exam .pill.xp{background:var(--xp);color:var(--xp-ink)}
@media (max-width:520px){.exam{grid-template-columns:1fr}}

/* world screen */
.whead{border-radius:22px;overflow:hidden;background:var(--cs);border:1px solid var(--line);display:grid;grid-template-columns:1fr 1.1fr;align-items:center}
.whead .txt{padding:20px;display:flex;flex-direction:column;gap:8px}
.whead .txt .tag{color:var(--c);font-weight:800}
.whead svg{display:block;width:100%;height:auto}
@media (max-width:600px){.whead{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.tabs button{flex:1;border:none;background:transparent;border-radius:12px;padding:10px 6px;font-weight:800}
.tabs button[aria-selected="true"]{background:var(--c,var(--primary));color:#fff}
.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:600px){.lessons{grid-template-columns:1fr}}
.lesson{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.lesson .thumb{border-radius:12px;overflow:hidden;background:var(--cs)}
.lesson .thumb svg{display:block;width:100%;height:auto}
.lesson .n{font-size:.8rem;color:var(--c);font-weight:800}
.lesson .ok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg2);color:var(--muted)}
.lesson.done .ok{background:var(--good);color:#fff}

/* lesson view */
.figure{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--cs);width:100%;max-width:560px;align-self:center}
.figure svg{display:block;width:100%;height:auto}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.points li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.points li::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c);margin-top:8px;justify-self:center}
.points b{color:var(--c)}
.check{border:2px dashed var(--c);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.check .lbl{font-weight:800;color:var(--c);font-size:.9rem}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:440px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--cs,var(--bg2));font-weight:800}

/* options */
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{text-align:start;font-weight:700;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center}
.opt .k{width:26px;height:26px;flex:none;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-size:.85rem;font-family:var(--display)}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 14px;font-weight:600}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .ex{display:block;color:var(--ink);font-weight:400;margin-top:4px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:.9rem}
.qtext{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.3}
.qimg{border-radius:16px;overflow:hidden;border:1px solid var(--line);max-width:420px;width:100%;align-self:center}
.qimg svg{display:block;width:100%;height:auto}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--bg2)}
.dots i.cur{background:var(--primary)}
.dots i.ans{background:var(--muted)}

/* flashcard */
.flash{perspective:1200px;border:none;background:none;padding:0;width:100%}
.flash-in{position:relative;min-height:250px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--cs);border-color:var(--c)}
.face .big{font-family:var(--display);font-size:1.5rem;font-weight:600;text-wrap:balance}
.face .hint{color:var(--muted);font-size:.85rem}

/* results */
.score{font-family:var(--display);font-size:4rem;line-height:1;font-weight:700}
.review{display:flex;flex-direction:column;gap:8px}
.review div{border-radius:14px;padding:10px 14px;background:var(--bad-soft)}
.review b{display:block}
.review span{color:var(--good);font-weight:700}

/* class table */
.board{width:100%;border-collapse:separate;border-spacing:0 8px}
.board td,.board th{border:none;padding:8px 10px;background:transparent}
.board th{font-size:.8rem;color:var(--muted);font-weight:800}
.board tr.r td{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.board tr.r td:first-child{border-radius:0 14px 14px 0;border-right:1px solid var(--line)}
.board tr.r td:last-child{border-radius:14px 0 0 14px;border-left:1px solid var(--line)}
.board tr.me td{background:var(--primary-soft)}
.board .nm{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.board .mini{width:70px}
.rank{font-family:var(--display);font-weight:700;font-size:1.2rem;width:52px;text-align:center}
.medal{width:30px;height:30px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:.9rem;background:var(--m);color:var(--mi);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.mname{display:block;font-family:var(--body);font-size:.68rem;font-weight:800;color:var(--muted);line-height:1.1;margin-top:3px;white-space:nowrap}
.status{font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st-learn{background:var(--bg2);color:var(--muted)}
.st-ready{background:var(--xp);color:var(--xp-ink)}
.st-done{background:var(--good-soft);color:var(--good)}
.st-star{background:var(--primary);color:var(--primary-ink)}
.tablewrap{max-width:100%}
.board .nm{white-space:normal;overflow-wrap:anywhere}
.board.compact{min-width:0}
@media (max-width:600px){.board .wide,.board .mini,.board .att{display:none}.board{min-width:0}.board td,.board th{padding:8px 5px}.board .nm{gap:6px;white-space:normal}.rank{width:44px}.board .av{width:28px;height:28px;font-size:1rem}.board:not(.compact) tr.r td:nth-child(5){border-left:1px solid var(--line);border-radius:14px 0 0 14px}}
.board.compact .mini{width:56px}
.podium{display:flex;align-items:flex-end;gap:8px;margin-top:4px}
.step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.step .av{width:44px;height:44px;font-size:1.6rem}
.step .pn{font-weight:800;font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.step .ps{font-size:.78rem;color:var(--muted);line-height:1.3}
.step .blk{width:100%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-weight:700;color:#3a2700;margin-top:4px}
.step .blk b{font-size:1.5rem;line-height:1}
.step.me .pn::after{content:" (אני)";color:var(--primary)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px color-mix(in srgb,#22c55e 25%,transparent);flex:none;animation:pulse 2s infinite}
.dot[hidden]{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,#22c55e 0%,transparent)}}
.more{border:1px solid var(--line);border-radius:16px;padding:4px 12px;background:var(--bg)}
.more>summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"▾";transition:transform .2s}
.more[open]>summary::after{transform:rotate(180deg)}
.board.compact td,.board.compact th{padding:8px 6px}
@media (max-width:420px){.board td,.board th,.board.compact td,.board.compact th{padding:8px 3px}.board .av{display:none}.rank{width:38px}.board .cov,.board .num.small{font-size:.8rem}}

/* onboarding */
.onb{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:stretch}
@media (max-width:760px){.onb{grid-template-columns:1fr}}
.onb .showcase{border-radius:24px;background:var(--ink);color:var(--bg);padding:22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.onb .showcase h1{color:var(--bg)}
.onb .showcase p{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini3 svg{display:block;width:100%;height:auto;border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:.9rem}
.input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:1.05rem}
.input:focus{border-color:var(--primary);outline:none}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:420px){.avs{grid-template-columns:repeat(4,1fr)}}
.avs button{aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:1.5rem;display:grid;place-items:center}
.avs button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.profiles{display:flex;gap:8px;flex-wrap:wrap}
.profiles button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 6px;font-weight:700}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
#fx canvas{width:100%;height:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--bg);border-radius:16px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem;font-weight:700}
.adm-tools{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
@media (max-width:600px){.adm-tools{grid-template-columns:1fr 1fr}.adm-tools input{grid-column:1/-1}}
.board.adm{min-width:820px}
.wpct{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:1px 6px;font-weight:800;font-size:.85rem;background:var(--bg2)}
.wpct.full{background:var(--good-soft);color:var(--good)}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-weight:700;padding:6px;align-self:center}
.reviewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--xp);color:var(--xp-ink);border-radius:16px;padding:10px 14px;font-weight:800}
.reviewbar .btn{background:var(--ink);color:var(--bg)}
.fb .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fb .actions .btn{font-size:.95rem;padding:9px 14px}
.idk{align-self:flex-start;background:none;border:1.5px dashed var(--line);border-radius:12px;padding:8px 14px;font-weight:700;color:var(--muted)}
.verified{border:2px solid var(--good);background:var(--good-soft);color:var(--good);border-radius:14px;padding:10px 14px;font-weight:800}
textarea.input{min-height:110px;resize:vertical;font-size:.95rem}
.list-admin{display:flex;flex-direction:column;gap:6px}
.list-admin div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="root"></div>
<div id="fx"></div>
<script type="application/json" id="board">{"rows":[],"updated":0}</script>
<script id="app">
"use strict";
/* ============================================================
   CONTENT — fifth-grade science, up to page 53

{id:"metals",name:"עולם המתכות",tag:"עולם 1",art:"worldMetals",blurb:"תכונות, סוגים ושימושים, מעגל חשמלי, מסגים, עיבוד שבבי וריקוע",
 lessons:[
 {id:"m1",title:"תכונות משותפות למתכות",img:"metal",pts:["מתכות הן <b>מוצקות</b> בטמפרטורת החדר – חוץ מ<b>כספית</b>, שהיא נוזל.","הן <b>מוליכות חשמל</b> ו<b>מוליכות חום</b>.","רובן <b>מבריקות</b>, עם צבע וצליל מתכתי.","אפשר <b>לכופף</b> אותן ו<b>לרקע</b> אותן.","<b>מוליכות חשמלית</b> היא התכונה שמבדילה מתכות מכל שאר החומרים.","בעולם יש כ-90 סוגי מתכות, ובכ-15 מהן משתמשים הרבה.","בשנת 2023 חצבו בעולם יותר מ-<b>2,000 מיליון טון ברזל</b>. גם אלומיניום ונחושת מופקים בכמויות עצומות."],
  check:{q:"איזו מתכת היא נוזל בטמפרטורת החדר?",o:["כספית","ברזל","נחושת","זהב"],a:0}},
 {id:"m2",title:"מגנטיות – לא כל מתכת היא ברזל",img:"magnet",pts:["מגנטיות = משיכה בין מגנט לחומר.","<b>ברזל</b> נמשך למגנט.","נחושת, אלומיניום, זהב וכסף <b>לא</b> נמשכים למגנט.","לכן מגנטיות היא תכונה <b>ייחודית</b> לחלק מהמתכות, ולא תכונה משותפת לכולן."],
  check:{q:"האם כל המתכות נמשכות למגנט?",o:["לא – רק חלק, למשל ברזל","כן – כל המתכות","רק נחושת","רק זהב"],a:0}},
 {id:"m3",title:"סוגי מתכות ושימושים",img:"uses",pts:["<b>נחושת</b> – חוטי חשמל: מוליכה טוב מאוד ולא יקרה.","<b>אלומיניום</b> – מטוסים וכבלי חשמל: <b>קל וחזק</b>, חוסך אנרגיה בהמראה.","<b>ברזל</b> – גשרים, מכוניות ושלד של בניינים: חזק.","<b>זהב</b> – תכשיטים ושבבי מחשב.","<b>בדיל</b> – מגן על מתכות אחרות מפני חלודה.","בוחרים מתכת לפי <b>התכונה הייחודית</b> שלה ולפי המטרה.","מתכות נוספות שמשתמשים בהן: <b>פלטינה</b> ו<b>עופרת</b>.","למרות שלמתכות יש תכונות דומות, <b>לכל מתכת יש שימוש ייחודי</b> – לכן לא מייצרים את כל המוצרים מאותה מתכת."],
  check:{q:"למה כנפי מטוס עשויות מאלומיניום?",o:["כי הוא קל וחזק","כי הוא נמשך למגנט","כי הוא מבריק","כי הוא נוזל"],a:0}},
 {id:"m4",title:"מוליכות ומעגל חשמלי",img:"circuit",pts:["סדר המוליכות: <b>כסף ← נחושת ← זהב ← אלומיניום</b>. כסף הכי טוב, אבל יקר מאוד.","חלקי מעגל: <b>סוללה</b>, <b>חוטי מתכת</b>, <b>נורה</b> ו<b>מפסק</b>.","<b>מעגל סגור</b> – הזרם עובר והנורה דולקת. <b>מעגל פתוח</b> – הנורה כבויה.","חומר שסוגר את המעגל ומדליק את הנורה הוא <b>מוליך</b> (מתכות). חומר שלא – <b>מבודד</b> (פלסטיק, עץ, גומי).","לכן חוטי חשמל עשויים מתכת ומצופים פלסטיק.","במתכת שמוליכה טוב, הזרם <b>זורם בקלות</b> ונוצר <b>פחות חום</b>."],
  check:{q:"מה צריך כדי שהנורה תידלק?",o:["מעגל סגור","מעגל פתוח","חוט מפלסטיק","מגנט"],a:0}},
 {id:"m5",title:"עפרות, הפקה ומסגים",img:"mine",img2:"bronze",pts:["<b>עפרת מתכת</b> = סלע שמכיל מתכת. כורים אותה במכרות פתוחים וסגורים.","מפיקים את המתכת בתהליך <b>צריפה</b> – חימום בכבשן.","בתמנע, ליד אילת, כרו נחושת כבר לפני כ-6,000 שנה. המכרה המודרני פעל מ-1959 ונסגר ב-1983.","מתכת טהורה רכה. מוסיפים לה חומרים ומקבלים <b>מסג</b> חזק יותר.","<b>ארד</b> = נחושת + מעט בדיל. <b>פלדה</b> = ברזל + מעט פחמן. <b>מסג כסף</b> = כסף + מעט נחושת.","מסג מכינים ב<b>התכה</b> ואחר כך <b>יציקה וקירור</b> בתבנית.","בעפרה יש מתכת יחד עם <b>חומרי טפל</b> – חומרים לא רצויים.","לצריפה יש <b>3 שלבים</b>: <b>א. סילוק חומרי הטפל</b> (ריסוק, טחינה וציפה) ← <b>ב. חימום</b> בתנור בטמפרטורה גבוהה מאוד: מתקבלת מתכת נוזלית, והטפל שנשאר נקרא <b>סיגים</b> ← <b>ג. יציקה וקירור</b> בתבנית.","מכרה תמנע נסגר ב-1983 בגלל <b>ירידה במחירי הנחושת</b>.","<b>ארד</b> – חזק ועמיד בשחיקה יותר מנחושת: כלים, מטבעות ופסלים. <b>מסג כסף</b> – חזק וקשה יותר מכסף טהור: תכשיטים וכלי כסף. <b>פלדה</b> – חזקה יותר מברזל ו<b>פחות מחלידה</b>: בתים, גשרים, שלדת מכונית, מנועים, כלי עבודה וכלי מטבח.","מדליות הזהב, הכסף והארד <b>אינן</b> ממתכת טהורה – כולן עשויות <b>מסגים</b>."],
  check:{q:"ממה עשוי ארד?",o:["נחושת ומעט בדיל","ברזל ופחמן","זהב וכסף","אלומיניום"],a:0}},
 {id:"m6",title:"יציקה ועיבוד שבבי",img:"key",pts:["<b>יציקה</b> – יוצקים מתכת נוזלית לתבנית ומקבלים צורה בסיסית.","<b>עיבוד שבבי</b> – מכונה מסירה חתיכות קטנות (<b>שבבים</b>) ויוצרת צורה <b>מדויקת</b>.","דוגמאות: הזיזים של מפתח, ההברגה של בורג, מכשירים רפואיים ומכשירי מדידה.","מפתח נוצר ב<b>יציקה + עיבוד שבבי</b>. ראש פטיש – ביציקה."],
  check:{q:"איך יוצרים את הזיזים המדויקים של מפתח?",o:["עיבוד שבבי","ריקוע","צריפה","אידוי"],a:0}},
 {id:"m7",title:"ריקוע וערגול",img:"rolling",pts:["<b>ריקוע</b> – מרדדים מתכת בפטיש או במערוך ומקבלים לוח שטוח.","<b>ערגול</b> – הריקוע של התעשייה: מעבירים גוש מתכת בין <b>שני גלילים</b> שמסתובבים בכיוונים מנוגדים.","מקבלים <b>פח</b> – לוח ארוך ודק.","מפח עושים פחיות, כנפי מטוס, גגות ודלתות של מכוניות.","<b>ניטינול</b> – \"מתכת חכמה\" שחוזרת לצורתה: גשר ליישור שיניים ותומכן (סטנט) לעורקים.","ריקוע בפטיש לא מתאים ללוחות <b>רחבים וארוכים מאוד</b> – לכן בתעשייה משתמשים בערגול. מפח עושים גם <b>לוחות פלדה לבנייה</b>.","בגשר ליישור שיניים אפשר <b>למתוח</b> את תיל הניטינול, והוא שומר על מתיחות גבוהה לאורך זמן ולוחץ על השיניים. <b>תומכן</b> הוא גליל מרושת מניטינול שמכניסים ל<b>עורק סתום</b> כדי שיישאר פתוח למעבר דם."],
  check:{q:"איך מייצרים פח דק לפחיות?",o:["בערגול – בין שני גלילים","בעיבוד שבבי","בצריפה","באידוי"],a:0}}
 ]},
{id:"rocks",name:"עולם הסלעים והקרקעות",tag:"עולם 2",art:"worldRocks",blurb:"סוגי סלעים ותכונותיהם, בנייה, איך נוצרת קרקע, חולית מול חרסיתית",
 lessons:[
 {id:"r1",title:"מהם סלעים?",img:"rocks",pts:["סלעים הם <b>השכבה המוצקה העליונה</b> של כדור הארץ. מעליהם שכבה דקה של קרקע.","אבנים הן חתיכות של סלעים.","סוגים: <b>גיר, בזלת, גרניט, צור, כורכר, קרטון, חוואר, חרסית, אבן חול, דולומיט</b>.","<b>גאולוגיה</b> = המדע שחוקר את כדור הארץ, סלעים וקרקעות.","גאולוגים חוקרים גם את <b>מבנה כדור הארץ</b> ואת <b>אוצרות הטבע</b>: פחם, נפט גולמי, עפרות מתכת ופוספט.","<b>אבנים</b> הן חתיכות של סלעים. <b>קרקעות</b> נוצרות מסלעים. קרקע היא <b>אוצר חיים</b>."],
  check:{q:"איך נקרא המדע שחוקר סלעים וקרקעות?",o:["גאולוגיה","ביולוגיה","אסטרונומיה","מתמטיקה"],a:0}},
 {id:"r2",title:"איך בודקים סלע?",img:"tests",pts:["בודקים: <b>צבע</b>, <b>מבנה</b>, <b>קשיות</b>, <b>עיסתיות</b> ו<b>תגובה לחומצה</b>.","<b>קשיות</b> – מנסים לשרוט במסמר. אם נשרט – הסלע רך.","<b>עיסתיות</b> – מוסיפים מים: חרסית הופכת לעיסה.","<b>תגובה לחומצה</b> – מטפטפים מיץ לימון: <b>גיר</b> מעלה בועות.","גאולוגים משתמשים בפטיש, במסמר ובחומצה מהולה.","בשדה: ב<b>פטיש</b> לוקחים <b>דגימה</b> של סלע, ב<b>מסמר</b> בודקים <b>קשיות</b>, וב<b>חומצה מהולה</b> בודקים <b>תסיסה</b> (בועות)."],
  check:{q:"מטפטפים לימון על סלע ורואים בועות. מה בודקים?",o:["תגובה לחומצה","קשיות","צבע","מגנטיות"],a:0}},
 {id:"r3",title:"סלעים בבנייה",img:"concrete",pts:["השימוש <b>הנפוץ ביותר</b> בסלעים – <b>בנייה</b>.","למה? סלעים <b>זמינים</b>, <b>חזקים ועמידים</b> במזג אוויר, <b>מבודדים חום ורעש</b> ועמידים בפני מזיקים.","<b>בטון</b> = מלט + חול + חצץ + מים. <b>מלט</b> = אבקה מגיר וחרסית שנקלו בתנור.","<b>בטון מזוין</b> = בטון + ברזל – לבניינים גבוהים.","<b>גבס</b> – חומר רך ולבן בין שכבות גיר וקרטון; יש מחצבה במכתש רמון.","חציבה פוגעת בסביבה: <b>נוף, זיהום אוויר ורעש</b>.","בעבר האבן הייתה חומר הבנייה המרכזי: <b>זמינה וזולה</b>, עמידה במזג האוויר, עם <b>מראה מרשים ותחושת ביטחון</b>. רואים זאת בערים עתיקות: <b>ירושלים, צפת וטבריה</b>.","היום בונים בעיקר מ<b>בטון, פלדה וזכוכית</b>. הזכוכית מאפשרת <b>חדירת אור טבעי</b>. באבנים משתמשים היום בעיקר ל<b>חיפוי</b> קירות, לריצוף ולתקרות.","בטון הוא <b>תערובת נוזלית</b> שיוצקים לתבניות, ואחרי זמן מה היא <b>מתקשה</b>. <b>חצץ</b> = אבנים גרוסות (גסות).","שימושים נוספים בסלעים: אריחים ולוחות ריצוף, פסלים, משחקים, כלים, גשרים וגורדי שחקים. מ<b>עפרות מתכת</b> מפיקים מתכות.","<b>גבס</b> – לבן-אפור, <b>רך מאוד וקל לעיבוד</b>: לוחות גבס לקירות ולתקרות, <b>טיח</b>, פיסול, תבניות מדויקות ו<b>תחבושות גבס</b> לשברים.","סלעים עמידים גם בפני מזיקים כמו <b>חולדות ועכברים</b>."],
  check:{q:"ממה מכינים בטון?",o:["מלט, חול, חצץ ומים","ברזל ופחמן","מלח ומים","זהב ונחושת"],a:0}},
 {id:"r4",title:"איך נוצרת קרקע?",img:"soil",pts:["קרקע נוצרת מ<b>התפוררות סלעים</b> לגרגירים קטנים (תהליכי בלייה).","בקרקע יש: <b>גרגירים</b>, <b>מים</b>, <b>אוויר</b> (ברווחים בין הגרגירים), <b>שרידי צמחים</b> ו<b>שרידי בעלי חיים</b>.","מגיר → <b>טרה רוסה</b> (חום-אדמדם). מקרטון → <b>רנדזינה</b> (אפרפר). מבזלת → <b>קרקע בזלת</b> (חום כהה).","קרקע היא <b>אוצר חיים</b>: צמחים נאחזים בה ושואבים ממנה מים ומזון, ובעלי חיים חיים בה.","<b>בלייה</b> – סלעים נשברים, משתנים ומתפוררים עד שהם נהיים גרגירים קטנים. הגרגירים הם <b>המרכיב העיקרי</b> של הקרקע.","שרידי בעלי חיים בקרקע: שלדים של <b>חיפושיות ונמלים</b> ו<b>קונכיות</b>. בקרקע חיים <b>שלשולים, נמלים, חולדים, נחשים ועקרבים</b>."],

 {id:"r5",title:"חולית מול חרסיתית ⭐",img:"jars",table:true,pts:["<b>קרקע חולית</b> – מקוורץ שהתפורר מגרניט. גרגירים גדולים. המים <b>מחלחלים מהר</b>. לא נהיית עיסה – אפשר לדרוך על חול רטוב בלי לשקוע.","<b>קרקע חרסיתית</b> – גרגירים זעירים, רואים רק במיקרוסקופ. <b>סופחת מים</b> והופכת ל<b>עיסה</b> (בוץ). המים מחלחלים <b>לאט מאוד</b>.","חול – בחוף הים. חרסית – למשל באפיקי נחלים."],

 {id:"r6",title:"שימושים בקרקע ופגיעה בה",img:"erosion",pts:["שימושים: <b>גידול צמחים</b> (חקלאות, גינות, מרעה), בסיס ל<b>בנייה</b>, חרסית ל<b>לבנים</b>, חול ל<b>בטון</b>.","פגיעה: <b>בנייה</b> מכסה את הקרקע; <b>דשנים וחומרי הדברה</b> בכמות לא נכונה; <b>עיבוד יתר</b>; <b>זיהום</b> בדלק ובמים מזוהמים.","<b>סחיפת קרקע</b> – אחרי כריתת יערות אין שורשים שמחזיקים את הקרקע, ומים ורוח סוחפים אותה.","<b>קרקע פורייה</b> – יש בה כל מה שצמח צריך.","קרקע משמשת גם ל<b>מרעה</b> של בקר וכבשים (חלב ובשר), ובסיס לבתים, קניונים, כבישים, גשרים, גינות ופארקים. <b>קרקע חולית</b> – לבנייה; מ<b>קרקע חרסיתית</b> מייצרים <b>לבנים</b>.","<b>עיבוד יתר</b> (למשל חריש רב מדי) עלול <b>לפרק את גרגירי הקרקע</b> ולהפוך אותה ל<b>פחות פורייה</b>. קרקע שמכסים בבנייה <b>הולכת לאיבוד</b> – יצורים חיים לא יכולים לחיות בה.","<b>דשנים</b> = חומרי הזנה לצמחים שמוסיפים לקרקע. <b>חומרי הדברה</b> = רעלים נגד מזיקים: חרקים, מכרסמים וגם צמחים. <b>קרקע פורייה</b> – יש בה חומרי מזון, יכולת לשמור מים ו<b>רווחי אוויר</b> בין הגרגירים."],

const SALT="sci-mx-2026-k7q";
function sig(str){let h1=0xdeadbeef^str.length,h2=0x41c6ce57^str.length;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}

const toHex=t=>[...new TextEncoder().encode(t)].map(b=>b.toString(16).padStart(2,"0")).join("");
const fromHex=h=>new TextDecoder().decode(new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16))));
function makeToken(){
  const day=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5).toString(36);
  const best=P.exam.best==null?101:P.exam.best;
  const body=["s1",toHex(me.name),toHex(me.cls),AVATARS.indexOf(me.av),meter(),best,P.exam.attempts,lessonsDone(),day].join("-");
  return body+"-"+sig(SALT+body);
}
function parseToken(t){
  if(!/^s1-[0-9a-f]+-[0-9a-f]+(-\d+){5}-[0-9a-z]+-[0-9a-z]+$/.test(t||""))return null;
  const parts=t.split("-"),mac=parts.pop(),body=parts.join("-");
  let name="",cls="";try{name=fromHex(parts[1]);cls=fromHex(parts[2])}catch(e){return null}
  const [, , ,av,m,best,att,les,day]=parts;
  const r={tok:t,name,cls,av:AVATARS[+av]||"🙂",meter:+m,best:+best===101?null:+best,attempts:+att,lessons:+les,day:parseInt(day,36)};
  r.ok=sig(SALT+body)===mac&&r.meter<=100&&(r.best==null||r.best<=100)&&r.lessons<=lessonsTotal&&!!name;
  r.date=new Date(r.day*864e5+12*36e5);r.key=(name.trim()+"|"+cls).toLowerCase();
  return r;
}

/* places: same exam score and learning % share a place; the next group takes the next place (1, 1, 2 …) */
const rankKey=r=>(r.best??-1)+"|"+(r.covered||0)+"|"+r.meter;
function placeOf(rows,i){const seen=new Set();for(let k=0;k<=i;k++)seen.add(rankKey(rows[k]));return seen.size}
/* after gold, silver and bronze: metals from the lessons by value, then rocks and stones */
const LADDER=[["זהב"],["כסף"],["ארד"],
  ["פלטינה","#e5e4e2","#1b2540"],["בדיל","#c9ccd1","#1b2540"],["נחושת","#c8743a","#fff"],["אלומיניום","#b9c2cc","#1b2540"],
  ["עופרת","#6b7280","#fff"],["פלדה","#8a9aa8","#fff"],["ברזל","#5d4b42","#fff"],
  ["גרניט","#c9a6a0","#1b2540"],["בזלת","#3a3d45","#fff"],["גיר","#e9e2cf","#1b2540"],["אבן","#9a8f80","#fff"],
  ["חצץ","#8f949c","#fff"],["חול","#e2c49b","#1b2540"],["חרסית","#b07b5a","#fff"]];
function medalCell(rk){
  if(rk<=3)return ["🥇","🥈","🥉"][rk-1]+`<span class="mname">${LADDER[rk-1][0]}</span>`;
  const m=LADDER[rk-1];if(!m)return rk;
  return `<div class="medal" style="--m:${m[1]};--mi:${m[2]}">${rk}</div><span class="mname">${m[0]}</span>`;
}
const isMine=r=>!!me&&r.key===(me.name.trim()+"|"+me.cls).toLowerCase();
/* the 3 leaders on a podium, the rest folded away */
function podium(rows){
  const H=[96,76,60],BG=["linear-gradient(#f9dc6b,#dcae1f)","linear-gradient(#e6eaf0,#aab4c0)","linear-gradient(#eab084,#b8763e)"];
  const step=i=>{const r=rows[i];if(!r)return `<div class="step"></div>`;const rk=placeOf(rows,i),k=Math.min(rk,3)-1;
    return `<div class="step${isMine(r)?" me":""}"><span class="av">${r.av}</span><span class="pn"><span class="dot" data-ok="${esc(r.key)}" ${r.online?"":"hidden"} title="לומד/ת עכשיו"></span> ${esc(r.name)}</span>
      <span class="ps">${esc(r.cls)} · ${r.meter}% למידה${r.covered?`<br>על ${r.covered}/${EXAM_BANK.length}`:""}${r.minutes?`<br>⏱ ${fmtTime(r.minutes)}`:""}</span>
      <div class="blk" style="height:${H[k]}px;background:${BG[k]}"><span>${["🥇","🥈","🥉"][k]}</span><b>${r.best??"—"}</b></div></div>`};
  return `<div class="podium">${[1,0,2].map(step).join("")}</div>`;
}
function leaderboard(rows,compact){
  if(!rows.length)return "";
  const rest=rows.length-3,mi=rows.findIndex(isMine);
  const on=rows.filter(r=>r.online).length;
  return `<p class="small" style="font-weight:800;color:#16a34a;text-align:center" id="onlineN">${on?`🟢 ${on} לומדים עכשיו`:""}</p>`+podium(rows)+(rest>0?`<details class="more"><summary><span>שאר הטבלה (${rest} ${rest===1?"ילד/ה":"ילדים"})${mi>=3?` · המקום שלך: ${placeOf(rows,mi)}`:""}</span></summary>${boardTable(rows,compact,3)}</details>`:"");
}
function boardTable(rows,compact,from=0){
  const mine=isMine;
  return `<div class="tablewrap"><table class="board${compact?" compact":""}"><thead><tr><th></th><th>תלמיד/ה</th><th>כיתה</th><th>למידה</th><th>מבחן</th>${compact?"":`<th class="wide">סטטוס</th><th class="wide">עודכן</th>`}</tr></thead><tbody>
  ${rows.slice(from).map((r,j)=>{const i=from+j;const [st,stc]=statusOf(r.meter,r.best);
    const rk=placeOf(rows,i);
    return `<tr class="r${mine(r)?" me":""}"><td class="rank">${medalCell(rk)}</td><td><span class="nm"><span class="av">${r.av}</span>${esc(r.name)}${mine(r)?" (אני)":""}<span class="dot" data-ok="${esc(r.key)}" ${r.online?"":"hidden"} title="לומד/ת עכשיו"></span></span></td><td>${esc(r.cls)}</td>
  <td><div class="row" style="flex-wrap:nowrap"><div class="bar mini" style="--c:var(--xp)"><i style="width:${r.meter}%"></i></div><b class="num small">${r.meter}%</b></div>${r.minutes?`<div class="small muted" style="white-space:nowrap">⏱ ${fmtTime(r.minutes)}</div>`:""}</td>
  <td class="num"><b>${r.best??"—"}</b>${r.attempts&&!compact?` <span class="small muted att">(${r.attempts})</span>`:""}${r.best!=null&&r.covered?`<div class="small muted cov" style="white-space:nowrap">על ${r.covered}/${EXAM_BANK.length}</div>`:""}</td>${compact?"":`<td class="wide"><span class="status ${stc}">${st}</span></td><td class="wide small muted">${r.date.toLocaleDateString("he-IL")}</td>`}</tr>`}).join("")}
  </tbody></table></div>${rows.some(r=>r.covered)?`<p class="small muted">מבחן = הציון הכי טוב. "על 40/${EXAM_BANK.length}" = נבחן/ה עד היום על 40 שאלות שונות מתוך ${EXAM_BANK.length} השאלות במאגר. באותו ציון – מי שנבחן/ה על יותר שאלות מקבל/ת מקום גבוה יותר.</p>`:""}${rows.some(r=>r.minutes)?`<p class="small muted">⏱ = זמן למידה פעיל באתר (שעות:דקות), נמדד מ-7.11.2026. 🟢 = לומד/ת באתר עכשיו.</p>`:""}`;
}

  <div id="wbody" class="w-${wid}"></div>`;

const SOIL_TABLE=`<div class="tbl"><table><tr><th></th><th>קרקע חולית</th><th>קרקע חרסיתית</th></tr><tr><td>מקור</td><td>קוורץ מגרניט</td><td>החומר חרסית</td></tr><tr><td>גודל גרגיר</td><td>גדול</td><td>זעיר (מיקרוסקופ)</td></tr><tr><td>חלחול מים</td><td>מהיר</td><td>איטי מאוד</td></tr><tr><td>עם מים</td><td>לא נהיית עיסה</td><td>נהיית עיסה (בוץ)</td></tr></table></div>`;

    <article class="panel stack w-${wid}" id="lessonTop">
      <span class="small" style="color:var(--c);font-weight:800">${w.name} · שיעור ${i+1}</span>

      <div class="figure">${ILL[l.img]()}</div>
      <ul class="points">${l.pts.map(p=>`<li><span>${p}</span></li>`).join("")}</ul>
      ${l.table?SOIL_TABLE:""}
      ${l.img2?`<div class="figure">${ILL[l.img2]()}</div>`:""}
      <button class="btn primary block" id="rb2">קראתי – חזרה לשאלה ←</button>

  root.innerHTML=`${topbar("world:"+wid)}

    <span class="small" style="color:var(--c);font-weight:800">${w.name} · שיעור ${i+1} מתוך ${w.lessons.length}</span>
    <h1>${l.title}</h1>
    ${lessonStale(l.id)?`<div class="fb bad">🆕 לשיעור הזה נוסף חומר חדש מדפי המידע. קראו אותו שוב וענו על שאלת הבדיקה למטה כדי לסיים אותו מחדש.</div>`:""}
    <div class="figure">${ILL[l.img]()}</div>
    <ul class="points">${l.pts.map(p=>`<li><span>${p}</span></li>`).join("")}</ul>
    ${l.table?SOIL_TABLE:""}
    ${l.img2?`<div class="figure">${ILL[l.img2]()}</div>`:""}
    <div class="check"><span class="lbl">✔ בדקו את עצמכם כדי לסיים את השיעור</span><b>${l.check.q}</b>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${"אבגד"[k]}</span>${o.t}</button>`).join("")}</div><div id="cfb"></div></div>

/* ---------- flashcards ---------- */
function cards(wid,body){
  const all=CARDS[wid].map((c,i)=>({c,i}));
  let deck=shuffle(all.filter(x=>!P.cards[wid+x.i]));if(!deck.length)deck=shuffle(all);
  let k=0;
  const draw=()=>{
    const known=all.filter(x=>P.cards[wid+x.i]).length;
    if(k>=deck.length){body.innerHTML=`<div class="panel stack" style="text-align:center;align-items:center"><div class="score">🎉</div><h2>סיימתם סבב!</h2><p class="muted">אתם יודעים ${known} מתוך ${all.length} כרטיסים.</p><div class="row"><button class="btn primary" id="again">סבב נוסף</button><button class="btn ghost" id="toP">לתרגול ←</button></div></div>`;
      document.getElementById("again").onclick=()=>cards(wid,body);document.getElementById("toP").onclick=()=>world(wid,"practice");if(known===all.length)confetti();return}
    const [f,b]=deck[k].c;
    body.innerHTML=`<div class="stack">
      <div class="row between"><span class="small muted num">כרטיס ${k+1} מתוך ${deck.length}</span><span class="pill good num">ידוע: ${known}/${all.length}</span></div>
      <button class="flash" id="fl" aria-label="הפוך כרטיס"><div class="flash-in"><div class="face"><div class="big">${f}</div><div class="hint">הקישו כדי להפוך</div></div><div class="face back"><div class="big">${b}</div><div class="hint">${f}</div></div></div></button>
      <div class="row" style="justify-content:center"><button class="btn ghost" id="no">עוד לא ↺</button><button class="btn good" id="yes">ידעתי ✓</button></div></div>`;
    const fl=document.getElementById("fl");fl.onclick=()=>fl.classList.toggle("flip");
    document.getElementById("yes").onclick=()=>{P.cards[wid+deck[k].i]=1;save();k++;draw()};
    document.getElementById("no").onclick=()=>{delete P.cards[wid+deck[k].i];save();deck.push(deck[k]);k++;draw()};
  };draw();
}

/* ---------- quiz engine (practice + exam) ---------- */
function buildQ(q){return {...q,opts:q.tf?q.o.map((t,k)=>({t,ok:k===q.a})):shuffle(q.o.map((t,k)=>({t,ok:k===q.a})))}}
function practiceIntro(wid,body){
  const all=worldQs(wid),n=all.length,m=masteredIn(wid),R=roundsOf(wid),size=roundSize(wid);
  const left=all.filter(q=>!M()[q.id]),pct=Math.floor(m/n*100);
  body.innerHTML=`<div class="panel stack">
    <h2>תרגול: ${W[wid].name}</h2>
    <div class="row between"><span class="small" style="font-weight:800">שלטתם ב-${m} מתוך ${n} שאלות</span><b class="num">${pct}%</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="muted">כדי לסיים את הנושא צריך לענות נכון על <b>כל ${n} השאלות</b>. התרגול מחולק ל-${R} סבבים של כ-${size} שאלות, וכל סבב מלא בלי טעויות שווה ${Math.round(100/R)}%. שאלה נספרת רק כשעונים עליה נכון בניסיון הראשון. שאלות שטעיתם בהן יחזרו בסבב הבא.</p>
    ${left.length?`<button class="btn primary" id="go">${m?"לסבב הבא":"להתחיל את הסבב הראשון"} ← (${Math.min(size,left.length)} שאלות)</button>`
      :`<div class="fb good">🎉 שלטתם בכל השאלות של ${W[wid].name}!</div><button class="btn ghost" id="rev">סבב חזרה (לא משנה את המד)</button>`}
  </div>`;
  if(document.getElementById("go"))document.getElementById("go").onclick=()=>runQuiz({mode:"practice",wid,qs:shuffle(left).slice(0,size).map(buildQ)});
  if(document.getElementById("rev"))document.getElementById("rev").onclick=()=>runQuiz({mode:"practice",wid,review:true,qs:shuffle(all).slice(0,size).map(buildQ)});
}
function examIntro(){
  if(meter()<EXAM_UNLOCK)return home();
  root.innerHTML=`${topbar("home")}
  <section class="panel stack">
    <span class="pill xp" style="align-self:flex-start">המבחן המסכם</span><h1>מוכנים?</h1>
    <ul class="points" style="--c:var(--primary)"><li><span><b>24 שאלות</b> – 8 מכל עולם, חלקן עם תמונות, מתוך מאגר של ${EXAM_BANK.length} שאלות. כל מבחן חוזר מגריל שאלות אחרות.</span></li><li><span>אפשר לחזור לשאלות קודמות ולשנות תשובה עד ההגשה.</span></li><li><span>הציון והתיקונים מופיעים אחרי ההגשה.</span></li><li><span>אפשר לגשת שוב כמה פעמים שרוצים. נשמר <b>הציון הכי טוב</b>.</span></li></ul>
    ${P.exam.attempts?`<p class="muted">ניסיונות קודמים: ${P.exam.history.map(h=>`<b>${h}</b>`).join(" · ")}</p>`:""}
    <button class="btn xp block" id="go">להתחיל את המבחן ←</button></section>`;
  bindNav();
  document.getElementById("go").onclick=()=>runQuiz({mode:"exam",qs:WORLDS.flatMap(w=>shuffle(EXAM_BANK.filter(q=>q.w===w.id)).slice(0,8)).map(buildQ)});
}
function runQuiz(st){
  const {mode,qs}=st;const ans=qs.map(()=>null);let i=0;const exam=mode==="exam";
  const solved=qs.map(()=>false),tried=qs.map(()=>new Set());   // practice: first answer is scored, retries until right
  const pfb=()=>{const q=qs[i],ref=lessonRef(q.les);
    if(solved[i])return `<div class="fb good">${ans[i]>=0&&q.opts[ans[i]].ok?"נכון!":"עכשיו זה נכון! 👏"}<span class="ex">${q.e}</span></div>`;
    if(tried[i].size)return `<div class="fb bad">לא בדיוק – נסו תשובה אחרת. לא בטוחים? התשובה נמצאת בשיעור, קראו וחזרו לענות.<div class="actions"><button class="btn ghost" id="toLes">📖 לשיעור: ${ref?ref.l.title:""}</button></div></div>`;
    if(ans[i]===-1)return `<div class="fb good">קראתם את השיעור – עכשיו בחרו תשובה.</div>`;
    return ""};
  let askHelp=-1;   // exam: index of a question whose help button was tapped once
  const draw=()=>{
    const q=qs[i];const helped=exam&&ans[i]===-2;
    root.innerHTML=`${topbar(exam?"home":"world:"+st.wid)}
    <section class="panel stack w-${q.w}">
      <div class="qhead"><span>${exam?"מבחן מסכם":"תרגול"} · ${W[q.w].name}</span><span class="num">${i+1} / ${qs.length}</span></div>
      ${exam?`<div class="dots">${qs.map((_,k)=>`<i class="${k===i?"cur":ans[k]!=null?"ans":""}"></i>`).join("")}</div>`:`<div class="bar"><i style="width:${i/qs.length*100}%"></i></div>`}
      <p class="qtext">${q.q}</p>
      ${q.img?`<div class="qimg">${ill(q.img)}</div>`:""}
      <div class="opts${q.tf?" two":""}">${q.opts.map((o,k)=>{const cls=exam?(helped?(o.ok?" right":""):ans[i]===k?" sel":""):solved[i]&&o.ok?" right":tried[i].has(k)?" wrong":"";
        return `<button class="opt${cls}" data-k="${k}" ${(!exam&&(solved[i]||tried[i].has(k)))||helped?"disabled":""}><span class="k">${q.tf?(k?"✗":"✓"):"אבגד"[k]}</span>${o.t}</button>`}).join("")}</div>
      ${!exam&&!solved[i]&&!tried[i].size?`<button class="idk" id="idk">🤔 לא יודע/ת – לקרוא בשיעור</button>`:""}
      ${exam&&!helped?`<button class="idk" id="help">${askHelp===i?"בטוח/ה? השאלה תיחשב כתשובה לא נכונה – להציג הסבר 💡":"💡 לא יודע/ת – עזרה (תיחשב כטעות)"}</button>`:""}
      ${helped?`<div class="fb bad">💡 עזרה: התשובה הנכונה היא <b>${q.o[q.a]}</b>.<span class="ex">${q.e}</span><span class="ex small muted">בשאלה הזו השתמשת בעזרה, ולכן היא תיחשב כתשובה לא נכונה.</span></div>`:""}
      <div id="qfb">${!exam?pfb():""}</div>
      <div class="row between">${exam?`<button class="btn ghost" id="qp" ${i===0?"disabled":""}>→ הקודמת</button>`:"<span></span>"}
        <button class="btn primary" id="qn" ${(exam?ans[i]==null:!solved[i])?"disabled":""}>${i<qs.length-1?"הבאה ←":exam?"הגשת המבחן ✓":"לסיום ←"}</button></div>
    </section>`;
    bindNav();
    root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      if(exam){if(helped)return;ans[i]=k;draw();return}
      if(solved[i]||tried[i].has(k))return;
      if(ans[i]==null)ans[i]=k;                 // the first answer is the one that counts
      if(q.opts[k].ok)solved[i]=true;else tried[i].add(k);
      draw();
    });
    const goLesson=()=>{const ref=lessonRef(q.les);if(!ref)return;if(ans[i]==null)ans[i]=-1;lesson(ref.wid,ref.i,draw)};
    if(document.getElementById("idk"))document.getElementById("idk").onclick=goLesson;
    if(document.getElementById("help"))document.getElementById("help").onclick=()=>{if(askHelp!==i){askHelp=i;draw();return}askHelp=-1;ans[i]=-2;draw()};
    if(document.getElementById("toLes"))document.getElementById("toLes").onclick=goLesson;
    if(document.getElementById("qp"))document.getElementById("qp").onclick=()=>{i--;draw()};
    document.getElementById("qn").onclick=()=>{
      if(i<qs.length-1){i++;draw();window.scrollTo(0,0);return}
      if(exam&&ans.some(a=>a==null)){toast("יש שאלות בלי תשובה");i=ans.findIndex(a=>a==null);draw();return}
      finish(st,ans);
    };
  };draw();
}
function finish(st,ans){
  const {mode,qs}=st;const isOk=(q,a)=>a>=0&&q.opts[a].ok;
  const right=qs.filter((q,k)=>isOk(q,ans[k])).length;const score=Math.round(right/qs.length*100);
  const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>!isOk(x.q,x.a));
  let isBest=false,gained=0;
  if(mode==="practice"){qs.forEach((q,k)=>{if(isOk(q,ans[k])&&!M()[q.id]){M()[q.id]=1;gained++}})}
  else{isBest=P.exam.best==null||score>P.exam.best;if(isBest)P.exam.best=score;P.exam.seen=[...new Set([...(P.exam.seen||[]),...qs.map(q=>q.id)])];P.exam.right=[...new Set([...(P.exam.right||[]),...qs.filter((q,k)=>isOk(q,ans[k])).map(q=>q.id)])];P.exam.attempts++;P.exam.last=score;P.exam.history.push(score)}
  save();
  const msg=score>=90?"מצוין! 🌟":score>=75?"יפה מאוד!":score>=55?"בכיוון הנכון – עוד קצת תרגול":"כדאי לחזור לשיעורים ולנסות שוב";
  root.innerHTML=`${topbar(mode==="exam"?"home":"world:"+st.wid)}
  <section class="panel stack" style="text-align:center;align-items:center">
    <span class="pill ${mode==="exam"?"xp":"primary"}">${mode==="exam"?`מבחן מסכם · ניסיון ${P.exam.attempts}`:"תרגול · "+W[st.wid].name}</span>
    <div class="score num">${score}</div><p class="muted">${mode==="practice"?"ציון הסבב: ":""}${right} תשובות נכונות מתוך ${qs.length}</p>
    <h2>${msg}</h2>
    ${isBest&&P.exam.attempts>1?`<span class="pill good">שיא חדש!</span>`:""}
    ${mode==="practice"?(()=>{const n=worldQs(st.wid).length,m=masteredIn(st.wid);return `<div style="width:100%;max-width:420px" class="stack"><div class="row between"><span class="small" style="font-weight:800">${W[st.wid].name}: שלטתם ב-${m} מתוך ${n} שאלות${gained?` (+${gained})`:""}</span><b class="num">${Math.floor(m/n*100)}%</b></div><div class="bar"><i style="width:${m/n*100}%"></i></div>${m<n?`<p class="small muted">נשארו ${n-m} שאלות. הנושא נגמר רק כשעונים נכון על כולן.</p>`:`<p class="small" style="color:var(--good);font-weight:800">🎉 סיימתם את כל שאלות הנושא!</p>`}</div>`})():""}
    ${mode==="exam"?`<p class="muted">הציון הכי טוב שלך: <b>${P.exam.best}</b>. אפשר לנסות שוב ולשפר לפני שולחים.</p>`:""}
    <div class="row" style="justify-content:center">
      ${mode==="exam"?`<button class="btn ghost" id="retry">↺ מבחן חוזר</button><button class="btn wa" id="send">${WA_SVG} שליחת הציון להורה</button>`
      :`${masteredIn(st.wid)<worldQs(st.wid).length?`<button class="btn primary" id="retry">לסבב הבא ←</button>`:`<button class="btn primary" id="retry">חזרה לנושא</button>`}<button class="btn ghost" data-nav="home">לדף הבית</button>`}
    </div>
  </section>
  ${wrong.length?(mode==="exam"?`<section class="panel stack"><h2>שאלות לתיקון</h2><div class="review">${wrong.map(x=>`<div><b>${x.q.q}</b><small class="muted">${x.a===-2?"💡 נעזרת בעזרה":"ענית: "+x.q.opts[x.a].t}</small><br><span>✓ ${x.q.o[x.q.a]}</span> <small>${x.q.e}</small></div>`).join("")}</div></section>`
    :`<section class="panel stack"><h2>כדאי לחזור על השיעורים האלה</h2><p class="muted small">בשאלות האלה לא הצלחתם בניסיון הראשון.</p><div class="lessons">${[...new Set(wrong.map(x=>x.q.les))].map(id=>{const r=lessonRef(id);return r?`<button class="lesson" data-rl="${id}"><div class="thumb">${ILL[r.l.img]()}</div><div><div class="n">${W[r.wid].name}</div><h3>${r.l.title}</h3></div><span class="ok">📖</span></button>`:""}).join("")}</div></section>`):""}`;
  bindNav();
  if(mode==="exam"?score>=75:(gained&&masteredIn(st.wid)===worldQs(st.wid).length)||score===100)confetti();
  document.getElementById("retry").onclick=()=>{if(mode==="exam")examIntro();else{world(st.wid,"practice");scrollTo(0,0)}};
  if(document.getElementById("send"))document.getElementById("send").onclick=()=>shareSheet();
  root.querySelectorAll("[data-rl]").forEach(b=>b.onclick=()=>{const r=lessonRef(b.dataset.rl);lesson(r.wid,r.i);scrollTo(0,0)});
}

const pending=()=>ls.get("pending",[]).filter(t=>!BOARD.rows.includes(t));
function addPending(toks){const cur=pending();toks.forEach(t=>{if(!cur.includes(t))cur.push(t)});ls.set("pending",cur)}
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
const HEAD='<title>מתכות, סלעים ומלחים</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Assistant:wght@400;600;700;800&display=swap">\n';
function pageSource(state){
  const SC="script",css=document.getElementById("css").textContent,code=document.getElementById("app").textContent;
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  return SKEL+HEAD+'<style id="css">'+css+'</style>\n<div id="root"></div>\n<div id="fx"></div>\n<'+SC+' type="application/json" id="board">'+json+'</'+SC+'>\n<'+SC+' id="app">'+code+'</'+SC+'>\n</body></html>';
}
async function publishBoard(addToks,removeKeys){
  if(!ART){toast("אי אפשר לפרסם מהתצוגה הזו");return}
  let toks=BOARD.rows.concat(addToks||[]).filter((t,i,a)=>a.indexOf(t)===i);
  if(removeKeys&&removeKeys.length)toks=toks.filter(t=>{const r=parseToken(t);return r&&!removeKeys.includes(r.key)});
  // keep only each child's latest row so the page stays small
  const keep=new Set(boardRows(toks).map(r=>r.tok));toks=toks.filter(t=>keep.has(t));
  const msg=document.getElementById("amsg");if(msg)msg.innerHTML=`<div class="fb good">מפרסם את הטבלה…</div>`;
  try{ls.set("pending",pending().filter(t=>!toks.includes(t)));history.replaceState(null,"",location.pathname+location.search);
    await ART.publish(pageSource({rows:toks,updated:Date.now()}))}
  catch(e){const c=e&&e.code;if(msg)msg.innerHTML=`<div class="fb bad">${c==="conflict"?"מישהו עדכן את הדף בדיוק עכשיו – הדף נטען מחדש. נסו שוב.":c==="not_writer"||c==="not_granted"?"רק בעלי הדף יכולים לפרסם את הטבלה.":"הפרסום לא הצליח. נסו שוב בעוד רגע."}</div>`}
}
function admin(){
  if(!IS_OWNER)return home();
  const pend=pending().map(parseToken).filter(r=>r&&r.ok),rows=boardRows();
  root.innerHTML=`${topbar(me?"home":null)}
  <section class="panel stack">
    <h1>🔑 ניהול טבלת התוצאות</h1>
    <p class="muted">רק את/ה רואה את המסך הזה. כשילד שולח לך קישור בווטסאפ, פתח/י אותו ולחץ/י "הוספה לטבלה ופרסום". אפשר גם להדביק כאן כמה הודעות בבת אחת.</p>
    <textarea class="input" id="paste" placeholder="הדביקו כאן הודעות מהווטסאפ"></textarea>
    <div class="row"><button class="btn ghost" id="scan">בדיקת ההודעות</button></div>
    <div id="amsg"></div>
    <h3>ממתינים לפרסום (${pend.length})</h3>
    ${pend.length?`<div class="list-admin">${pend.map(r=>`<div><span>${r.av} <b>${esc(r.name)}</b> · ${esc(r.cls)}</span><span class="small num">למידה ${r.meter}% · מבחן ${r.best??"—"}</span></div>`).join("")}</div><button class="btn primary block" id="pub">פרסום ${pend.length} תוצאות לכל הכיתה</button>`:`<p class="muted small">אין תוצאות שממתינות.</p>`}
  </section>
  <section class="panel stack">
    <h3>בטבלה כרגע (${rows.length})</h3>
    ${rows.length?`<div class="list-admin">${rows.map(r=>`<div><span>${r.av} <b>${esc(r.name)}</b> · ${esc(r.cls)} · ${r.meter}% · ${r.best??"—"}</span><button class="btn ghost" data-rm="${esc(r.key)}">הסרה</button></div>`).join("")}</div>`:`<p class="muted small">הטבלה ריקה.</p>`}
    <div id="rmc"></div>
  </section>`;
  bindNav();
  document.getElementById("scan").onclick=()=>{
    const toks=[...document.getElementById("paste").value.matchAll(/(s1-[0-9a-z-]+)/g)].map(m=>parseToken(m[1])).filter(Boolean);
    const ok=toks.filter(r=>r.ok),bad=toks.length-ok.length;
    if(!toks.length){document.getElementById("amsg").innerHTML=`<div class="fb bad">לא נמצאו קישורי תוצאה. העתיקו את כל ההודעה, כולל הקישור.</div>`;return}
    addPending(ok.map(r=>r.tok));admin();
    document.getElementById("amsg").innerHTML=`<div class="fb good">נמצאו ${ok.length} תוצאות תקינות.${bad?`<span class="ex">${bad} קישורים שונו ולא נכנסו.</span>`:""}</div>`;
  };
  if(document.getElementById("pub"))document.getElementById("pub").onclick=()=>publishBoard(pend.map(r=>r.tok));
  root.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.rm;document.getElementById("rmc").innerHTML=`<div class="fb bad">להסיר את התלמיד/ה מהטבלה של כולם?<span class="ex"><button class="btn ghost" id="rmy" style="margin-top:8px">כן, להסיר ולפרסם</button></span></div>`;
    document.getElementById("rmy").onclick=()=>publishBoard([],[k]);
  });
}

/* ---------- moving from the old Claude link: progress arrives in the URL hash ---------- */
const SITE_URL="https://denizvek.github.io/science-exam-prep/";
const ON_SITE=/github\.io$/.test(location.hostname);
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/"))));
function moveLink(){   // old link -> new site, carrying every child on this device
  const data={};profiles.forEach(pr=>{data[pr.id]=ls.get("p:"+pr.id,null)});
  return SITE_URL+"#import="+b64e(JSON.stringify({v:1,profiles,data,active:me?me.id:null}));
}
function syncOne(pr,data){   // send one child's row (not only the active one)
  if(!LIVE_ON)return;const sm=me,sp=P;me=pr;P=data;let d;try{d=payload()}finally{me=sm;P=sp}
  fetch(SUPA_URL+"/rest/v1/rpc/save_result",{method:"POST",headers:SUPA_H,keepalive:true,
    body:JSON.stringify({p_id:d.id,p_name:d.name,p_cls:d.cls,p_av:d.av,p_meter:d.meter,p_lessons:d.lessons,p_best:d.best,p_attempts:d.attempts,p_covered:d.covered,p_minutes:d.minutes,p_correct:d.correct})}).catch(()=>{});
}
function importFromHash(){
  const m=location.hash.match(/^#import=([A-Za-z0-9_-]+)$/);if(!m)return false;
  history.replaceState(null,"",location.pathname+location.search);
  let d;try{d=JSON.parse(b64d(m[1]))}catch(e){return false}
  if(!d||!Array.isArray(d.profiles)||!d.data||typeof d.data!=="object")return false;
  const amount=x=>x&&typeof x==="object"?Object.keys(x.lessons||{}).length+Object.keys(x.cards||{}).length+Object.keys(x.mastered||{}).length+((x.exam&&+x.exam.attempts)||0):-1;
  let n=0;
  d.profiles.forEach(pr=>{
    if(!pr||typeof pr.id!=="string"||pr.id.length<8||pr.id.length>40||!pr.name)return;
    const inc=d.data[pr.id];if(!inc||typeof inc!=="object")return;
    if(!inc.exam)inc.exam={best:null,attempts:0,last:null,history:[]};
    let ex=profiles.find(x=>x.id===pr.id);
    if(!ex){ex={id:pr.id,name:String(pr.name).slice(0,40),cls:String(pr.cls||"").slice(0,10),av:AVATARS.includes(pr.av)?pr.av:"🙂"};profiles.push(ex)}
    if(amount(inc)>=amount(ls.get("p:"+pr.id,null)))ls.set("p:"+pr.id,inc);
    syncOne(ex,ls.get("p:"+pr.id,blank()));n++;
  });
  if(!n)return false;
  ls.set("profiles",profiles);
  const act=profiles.find(x=>x.id===d.active)||profiles.find(x=>d.data[x.id]);
  if(act){me=act;ls.set("active",act.id);P=ls.get("p:"+act.id,blank())}
  setTimeout(()=>toast(n>1?`ההתקדמות של ${n} ילדים הועברה לאתר החדש ✓`:"ההתקדמות שלך הועברה לאתר החדש ✓"),300);
  return true;
}
function route(){
  if(importFromHash())LIVE=null;
  const h=location.hash.slice(1);
  if(/^s1-/.test(h)){const r=parseToken(h);if(r)return resultLink(r)}
  me?home():onboarding();
}
route();
window.addEventListener("hashchange",route);
(async()=>{try{
  const c=window.claude;if(!c||!c.use)return;
  const u=await c.use("user");IS_OWNER=u?await u.isOwner():false;
  if(IS_OWNER){ART=await c.use("artifact");if(SCREEN==="home"||SCREEN==="result")route()}
}catch(e){}})();
</script>
